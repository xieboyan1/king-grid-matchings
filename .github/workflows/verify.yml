name: Verify Lean proofs

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          use-github-cache: 'false'
      - name: Recheck sources in a fresh directory and audit axioms
        run: python3 scripts/verify.py
      - name: Check the counting formulas by independent enumeration
        run: python3 scripts/check_small_boards.py
